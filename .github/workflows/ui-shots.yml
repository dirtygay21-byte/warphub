# UI screenshots of WarpBuilder screens (demo build, phone size) for design review.
# Runs only on pull requests with the label "ui-shots" (no deployment, no secrets) — to save GitHub Actions minutes.
# Result: artifact "ui-shots" with PNG files and log.txt. Script: tools/ui-shots/shots.mjs.
name: UI screenshots

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ui-shots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shots:
    name: Screenshots (demo build)
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ui-shots') || contains(github.event.pull_request.labels.*.name, 'ui-audit') || contains(github.event.pull_request.labels.*.name, 'ui-ta') || contains(github.event.pull_request.labels.*.name, 'ui-photos') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install client
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Build demo
        working-directory: client
        run: bunx vite build --mode demo --outDir dist-demo
      - name: Install Playwright (Chromium)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Screenshots
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: |
          node tools/roster-demo/server.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5050/ >/dev/null && break; sleep 1; done
          # обзор всех разделов (ui-audit) — на PR с меткой «ui-audit»; обычные снимки — с меткой «ui-shots»
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'ui-audit') }}" = "true" ]; then node tools/ui-shots/audit.mjs ui-shots;
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'ui-ta') }}" = "true" ]; then node tools/ui-shots/testarmy.mjs ui-shots;
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'ui-photos') }}" = "true" ]; then node tools/ui-shots/photos.mjs ui-shots;
          else node tools/ui-shots/shots.mjs ui-shots; fi
          cp /tmp/server.log ui-shots/server.log || true
      - name: Print screenshots (base64, for readers without artifact access)
        if: ${{ always() }}
        run: |
          cat ui-shots/log.txt || true
          for f in ui-shots/*.jpg; do echo "SHOT-BEGIN $(basename "$f")"; base64 -w 0 "$f"; echo; echo "SHOT-END"; done
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ui-shots
          path: ui-shots
          retention-days: 7
