# Validation only: tests, type check, lint and build. No secrets, no deployment.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roster-data:
    name: Roster data tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 40K tests rebuild their baseline from git history (scripts/baseline-40k.mjs)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Tests (engines, data; CSV cross-checks skip without the export)
        working-directory: tools/roster-data
        run: bun test tests/
      - name: AoS data is stable under repair
        working-directory: tools/roster-data
        run: node scripts/repair-aos-data.mjs --check

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Tests (e2e tests skip without WARPHUB_E2E=1)
        working-directory: backend
        run: bun test tests

  backend-e2e:
    name: "Backend e2e: admins"
    # (имя job сохранено; внутри — и тесты записи короче полной длительности, B1)
    # Настоящий сервер + временный PostgreSQL на раннере GitHub; новые сквозные тесты (admins-e2e, booking-short-e2e, online-games-e2e).
    # Все секреты — тестовые заглушки; уведомления выключены, наружу ничего не уходит.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wh_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_URI: postgres://postgres:postgres@127.0.0.1:5432/wh_e2e
      TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN_FOR_LOCAL_RUN"
      JWT_SECRET: e2e-jwt-secret
      BOT_INTERNAL_SECRET: e2e-internal-secret
      S3_ACCESS_KEY: e2e
      S3_SECRET_KEY: e2e
      S3_BUCKET: e2e
      S3_PUBLIC_URL: http://127.0.0.1/e2e
      PORT: "4100"
      TELEGRAM_NOTIFICATIONS: "off"
      ADMIN_TELEGRAM_IDS: "777"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Database schema (from src/db/schema)
        working-directory: backend
        # drizzle-kit push создавал схему не полностью — генерируем полный SQL из схемы и применяем psql (ошибки видны)
        run: |
          bunx drizzle-kit generate --dialect postgresql --schema ./src/db/schema --out ./e2e-schema --name init
          # drizzle-kit пишет числа в CHECK как параметры ($1); во всех проверках схемы это 0 (gt(x, 0))
          sed -E -i 's/\$[0-9]+/0/g' e2e-schema/*.sql
          for f in e2e-schema/*.sql; do
            psql "$POSTGRES_URI" -v ON_ERROR_STOP=1 -q -f "$f" 2> psql.err || { sed 's/^/::error::schema: /' psql.err | head -5; exit 1; }
          done
      - name: Migrations 0014–0016 apply on top (idempotent)
        run: for f in backend/drizzle/0014_admin_users.sql backend/drizzle/0015_online_games.sql backend/drizzle/0016_dnd_flexible_schedule.sql; do psql "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Tables in the test database
        run: |
          T=$(psql "$POSTGRES_URI" -Atc "select string_agg(table_name, ' ' order by table_name) from information_schema.tables where table_schema='public'")
          echo "::notice::tables - $T"
      - name: Start the API
        working-directory: backend
        run: |
          nohup bun run src/index.ts > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4100/health >/dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: E2E tests
        working-directory: backend
        run: WARPHUB_E2E=1 bun test tests/admins-e2e.test.ts tests/booking-short-e2e.test.ts tests/online-games-e2e.test.ts tests/dnd-flexible-e2e.test.ts tests/booking-game-e2e.test.ts tests/table-holds-e2e.test.ts tests/progress-e2e.test.ts tests/supporters-e2e.test.ts
      - name: API log on failure
        if: failure()
        working-directory: backend
        # строки лога — ещё и аннотациями (их можно прочитать через API GitHub без полного лога)
        run: |
          tail -100 api.log
          grep -inE "error|exception|fail|warn|missing|relation|column" api.log | tail -15 | cut -c1-400 | while IFS= read -r l; do echo "::error::api.log: $l"; done
          tail -5 api.log | cut -c1-400 | while IFS= read -r l; do echo "::warning::api.log tail: $l"; done

  client:
    name: Client type check, lint, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: client
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: client
        # ESLint problems are also reported as annotations (summary first, then up to 9 problems),
        # so they can be read from the GitHub API without the full log.
        run: |
          bunx eslint . -f json -o eslint-report.json || true
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("eslint-report.json")) { console.log("::error::ESLint did not produce a report (configuration or crash) — see the log"); process.exit(1); }
            const files = JSON.parse(fs.readFileSync("eslint-report.json", "utf8"));
            const root = process.env.GITHUB_WORKSPACE + "/";
            const probs = files.flatMap((f) => f.messages.map((m) => ({ ...m, file: f.filePath.replace(root, "") })));
            const errors = probs.filter((m) => m.severity === 2), warnings = probs.filter((m) => m.severity === 1);
            const byRule = {};
            for (const m of probs) byRule[(m.ruleId ?? "fatal") + (m.severity === 2 ? "" : " (warn)")] = (byRule[(m.ruleId ?? "fatal") + (m.severity === 2 ? "" : " (warn)")] ?? 0) + 1;
            const summary = `ESLint: ${errors.length} errors, ${warnings.length} warnings in ${files.filter((f) => f.messages.length).length} files. By rule: ` + Object.entries(byRule).sort((a, b) => b[1] - a[1]).map(([r, n]) => `${r} ${n}`).join("; ");
            console.log(summary);
            console.log(`::${errors.length ? "error" : "notice"}::${summary}`);
            for (const m of [...errors, ...warnings].slice(0, 9)) console.log(`::${m.severity === 2 ? "error" : "warning"} file=${m.file},line=${m.line ?? 1},col=${m.column ?? 1}::${m.ruleId ?? "fatal"}: ${String(m.message).replace(/\r?\n/g, " ")}`);
            for (const m of probs) console.log(`${m.file}:${m.line}:${m.column} ${m.severity === 2 ? "error" : "warn"} ${m.ruleId ?? "fatal"} ${m.message}`);
            process.exit(errors.length ? 1 : 0);
          '
      - name: Build (tsc -b && vite build)
        if: ${{ !cancelled() }}
        working-directory: client
        run: bun run build
